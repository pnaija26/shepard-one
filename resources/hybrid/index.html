<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta name="theme-color" content="#123b2a" />
    <title>ShepardOne</title>
    <style>
      :root { color-scheme: light; }
      html, body, #app {
        margin: 0;
        min-height: 100%;
        background: #f4f6f3;
        color: #17231e;
        font-family: "Instrument Sans", system-ui, sans-serif;
      }
      .hybrid-boot {
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 2rem;
        text-align: center;
      }
      .hybrid-boot__mark {
        display: grid;
        place-items: center;
        width: 3rem;
        height: 3rem;
        margin: 0 auto 1rem;
        border-radius: 0.5rem;
        background: #123b2a;
        color: #fff;
        font-family: Georgia, serif;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="hybrid-boot" role="status" aria-live="polite">
        <div>
          <div class="hybrid-boot__mark" aria-hidden="true">S1</div>
          <p><strong>ShepardOne</strong></p>
          <p>Loading secure workspace…</p>
        </div>
      </div>
    </div>
    <script type="module" src="../js/hybrid.js"></script>
  </body>
</html>
